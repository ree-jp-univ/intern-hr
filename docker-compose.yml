version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: fuelphp-app
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      FUEL_ENV: production
      DB_HOST: db
      DB_NAME: ${DB_NAME:-fuelphp}
      DB_USER: ${DB_USER:-fuelphp}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fuelphp-network

  db:
    image: mysql:8.0
    container_name: fuelphp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-fuelphp}
      MYSQL_USER: ${DB_USER:-fuelphp}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/conf.d:/etc/mysql/conf.d
      - ./docker/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fuelphp-network

volumes:
  db-data:

networks:
  fuelphp-network:
    driver: bridge
